<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="John Broadway — sovereign AI systems you can hand the keys to: planned, undoable, proven">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A26"/>
      <stop offset="1" stop-color="#0D111A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <path id="topArc" d="M -86,2 A 86,86 0 0 0 86,2" fill="none"/>
  </defs>

  <!-- field -->
  <rect width="1200" height="340" fill="url(#ink)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- faint architect's grid -->
  <g stroke="#27303F" stroke-width="1" opacity="0.55">
    <line x1="0" y1="40"  x2="1200" y2="40"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>
  <g stroke="#C9A24B" stroke-width="1" opacity="0.5">
    <line x1="40" y1="40" x2="40" y2="300"/>
    <line x1="1160" y1="40" x2="1160" y2="300"/>
  </g>

  <!-- ── the seal ── -->
  <g transform="translate(168,170)" fill="none" stroke="#C9A24B">
    <circle r="98" stroke-width="1.5"/>
    <circle r="80" stroke-width="1"/>
    <circle r="52" stroke-width="1" opacity="0.7"/>
    <!-- circular motto -->
    <text font-family="Georgia, 'Times New Roman', serif" font-size="11.5" letter-spacing="2.2"
          fill="#C9A24B" stroke="none" font-weight="bold">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">PLANNED · UNDOABLE · PROVEN</textPath>
    </text>
    <!-- the gate: a door admits; it never decides -->
    <g stroke="#C9A24B" stroke-width="2.4" stroke-linecap="round">
      <line x1="-20" y1="-26" x2="-20" y2="30"/>
      <line x1="20"  y1="-26" x2="20"  y2="30"/>
      <path d="M -20,-26 Q 0,-40 20,-26" fill="none"/>
    </g>
    <path d="M 0,-6 L 9,4 L 0,14 L -9,4 Z" fill="#C9A24B" stroke="none"/>
  </g>

  <!-- ── the name block ── -->
  <g transform="translate(300,0)">
    <text x="0" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14"
          letter-spacing="4.2" fill="#8B94A3">INDEPENDENT RESEARCHER  ·  SELF-TAUGHT SYSTEMS BUILDER</text>

    <text x="-3" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="66"
          letter-spacing="2" fill="#EFEADD">JOHN <tspan fill="#C9A24B">BROADWAY</tspan></text>

    <line x1="0" y1="220" x2="150" y2="220" stroke="#C9A24B" stroke-width="1.5"/>

    <text x="0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="22"
          font-style="italic" fill="#C9CFD9">Sovereignty is a belief before it&#39;s an architecture.</text>
  </g>
</svg>
